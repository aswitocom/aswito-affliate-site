<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">

  <!-- Magnet arch outer -->
  <path d="M5 18 Q5 3 16 3 Q27 3 27 18" stroke="#1e293b" stroke-width="8" stroke-linecap="butt" fill="none"/>
  <!-- Magnet arch inner cutout -->
  <path d="M7.5 18 Q7.5 7 16 7 Q24.5 7 24.5 18" stroke="white" stroke-width="3" stroke-linecap="butt" fill="none"/>

  <!-- Left arm red -->
  <rect x="5" y="17" width="8" height="12" rx="1.5" fill="#ef4444"/>
  <!-- Right arm blue -->
  <rect x="19" y="17" width="8" height="12" rx="1.5" fill="#3b82f6"/>

  <!-- Eyes -->
  <circle cx="12.5" cy="12" r="2.2" fill="white"/>
  <circle cx="19.5" cy="12" r="2.2" fill="white"/>
  <circle cx="13" cy="12.5" r="1.2" fill="#1e293b"/>
  <circle cx="20" cy="12.5" r="1.2" fill="#1e293b"/>

  <!-- Smile -->
  <path d="M13 16.5 Q16 19.5 19 16.5" stroke="#f97316" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Left spark coin -->
  <circle cx="1.5" cy="14" r="2.5" fill="#fbbf24"/>
  <!-- Right spark coin -->
  <circle cx="30.5" cy="14" r="2.5" fill="#fbbf24"/>

</svg>
